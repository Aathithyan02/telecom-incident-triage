<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  
  <!-- Antenna / Tower -->
  <path d="M32 14 L20 54 M32 14 L44 54 M23 42 L41 42 M26 31 L38 31" 
        stroke="url(#cyan-glow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tower Transmitter Node -->
  <circle cx="32" cy="14" r="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Radio signal waves -->
  <path d="M24 10 A 11 11 0 0 0 24 18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M40 10 A 11 11 0 0 1 40 18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M18 6 A 18 18 0 0 0 18 22" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M46 6 A 18 18 0 0 1 46 22" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- NOC Status dot -->
  <circle cx="49" cy="49" r="4" fill="#10b981" />
  <circle cx="49" cy="49" r="6.5" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
</svg>
